<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERLC Autopilot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="overlay-body">
<div class="overlay-card" id="overlayCard">
  <div class="overlay-top">
    <span class="dot" id="engagedDot"></span>
    <span class="overlay-title">ERLC AUTOPILOT</span>
    <span class="overlay-tier" id="overlayTier">—</span>
  </div>

  <div class="overlay-cam">
    <img id="camThumb" src="/video_feed" alt="camera preview">
    <div class="cam-badge" id="camBadge">ENGAGED</div>
  </div>

  <div class="overlay-ev-banner hidden" id="evBanner">⚠ EMERGENCY VEHICLE — YIELDING</div>

  <div class="overlay-stats">
    <div class="overlay-stat">
      <span class="label">SPEED</span>
      <span class="value" id="ovSpeed">0</span>
      <span class="unit">mph</span>
    </div>
    <div class="overlay-stat">
      <span class="label">TARGET</span>
      <span class="value" id="ovTarget">0</span>
      <span class="unit">mph</span>
    </div>
  </div>

  <div class="overlay-status" id="ovStatus">cruising</div>
  <div class="overlay-signal" id="ovSignal"></div>

  <div class="overlay-buttons">
    <button id="btnOvToggle" class="btn btn-primary small">⏸ Disengage</button>
    <button id="btnOvHonk" class="btn small">📯</button>
    <button id="btnOvHazard" class="btn small">⚠</button>
    <button id="btnOvSettings" class="btn small">⚙</button>
  </div>
</div>
<script src="{{ url_for('static', filename='overlay.js') }}"></script>
</body>
</html>
